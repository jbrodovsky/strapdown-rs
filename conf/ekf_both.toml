# EKF with both gravity and magnetic anomaly measurements
input = "data/input"
output = "data/output/ekf/both"
mode = "closed-loop"
seed = 42
parallel = true
generate_plot = true

[logging]
level = "info"
file = "log/ekf_both.log"

[filter]
type = "ekf"

[geophysical]
# Gravity anomaly measurements
gravity_resolution = "one_minute"
gravity_bias = 5.97
gravity_noise_std = 48.93

# Magnetic anomaly measurements
magnetic_resolution = "two_minutes"
magnetic_bias = 40364.0
magnetic_noise_std = 41303.0

# Measurement frequency (seconds)
geo_frequency_s = 1.0

[gnss_degradation]
seed = 42

[gnss_degradation.scheduler]
kind = "fixed_interval"
interval_s = 60.0
phase_s = 0.0

[gnss_degradation.fault]
kind = "degraded"
rho_pos = 0.98
sigma_pos_m = 5.0
rho_vel = 0.90
sigma_vel_mps = 2.0
r_scale = 5.0
