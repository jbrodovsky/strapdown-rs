input = "data/input"
output = "data/output/ekf/degraded"
mode = "closed-loop"
seed = 42
parallel = true
generate_plot = true


[logging]
level = "info"
file = "log/ekf_degraded.log"

[filter]
type = "ekf"

[gnss_degradation]
seed = 42

[gnss_degradation.scheduler]
kind = "fixed_interval"
interval_s = 60.0
phase_s = 0.0

[gnss_degradation.fault]
kind = "degraded"
rho_pos = 0.98
sigma_pos_m = 5.0
rho_vel = 0.90
sigma_vel_mps = 2.0
r_scale = 5.0
