# EKF under intermittent GNSS denial -- the availability tier.
#
# conf/ekf_degraded.toml models the *fringe* of a jammed area: fixes still arrive, with more
# error on them and a wider advertised accuracy. This file models the inside of one, which is
# the case the literature actually reports and the case a geophysical aid is for.
input = "data/input"
output = "data/output/ekf/denied"
mode = "closed-loop"
is_enu = true
seed = 42
parallel = true
generate_plot = true

[logging]
level = "info"
file = "log/ekf_denied.log"

[closed_loop]
filter = "ekf"

[health_limits]
# Matched to conf/ekf_degraded.toml so the two fail the same trajectories and stay comparable.
nis_pos_max = 1000.0
speed_mps_max = 5000.0

[gnss_degradation]
seed = 42

# Denial, not degradation. This is the tier that actually resembles jamming: at Jammertest a
# phone roughly ten metres from a jammer lost lock entirely, and in most runs the jamming
# signal was strong enough to cause complete loss of the GNSS signal. A receiver inside the
# jammed area does not report a noisier position -- it reports nothing.
#
# 30 s of fixes in every 150 is a 20% duty cycle: long enough to re-converge between outages,
# so each outage starts from a comparable state, and 120 s of unaided inertial is where a MEMS
# platform's drift becomes the dominant error and an aid has something to correct.
#
# Sweep `off_s` over 60 / 120 / 300 / 600 to trace how the aid's contribution grows with the
# outage. The fault is `none` on purpose: the fixes that do arrive are the receiver's own, so
# the only variable is availability.
[gnss_degradation.scheduler]
kind = "duty_cycle"
on_s = 30.0
off_s = 120.0
start_phase_s = 0.0

[gnss_degradation.fault]
kind = "none"
