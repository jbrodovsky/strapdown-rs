input = "data/input"
output = "data/output/ukf/degraded"
mode = "closed-loop"
# These recipes read Sensor Logger exports from `data/input`, which are ENU
# convention: at rest the device reports +g along its up axis. The library default
# is NED as of #272, so the frame has to be declared -- `strapdown-sim` checks it
# against the data and refuses rather than silently double-counting gravity (#296).
is_enu = true
seed = 42
parallel = true
generate_plot = true

[logging]
level = "info"
file = "log/ukf_degraded.log"

[closed_loop]
filter = "ukf"

[health_limits]
# Both guards are loosened so a MEMS-grade recording is allowed to drift to its end rather
# than being failed part way through.
#
#   nis_pos_max    default 100 -- two trajectories peak at 897 and 476 while still tracking.
#   speed_mps_max  default 500 -- only 2025-06-14_21-17-02 reaches it, the worst recording
#                  in the set (587 rows, median hAcc 16.2 m, a 1000 m sentinel at p95).
#
# The cost is real and applies to both: a genuinely diverged filter can now run to
# completion and land in the aggregates, so a run finishing is weaker evidence that it
# stayed healthy than it used to be. Kept identical across truth and degraded so the two
# always fail the same trajectories and remain comparable.
nis_pos_max = 1000.0
speed_mps_max = 5000.0


# The fringe-of-jamming profile, anchored to measurement rather than to a round number.
#
# Smartphone GNSS is 3-5 m under good multipath and over 10 m in harsh multipath, with
# semi-urban CEP95 around 10-12 m. Under jamming the tracked satellite count falls and GDOP
# rises, so the true error and the advertised accuracy inflate together. 35 m of steady-state
# wander is about 14x this dataset's 2.58 m median advertised accuracy -- a receiver still
# producing fixes, but bad ones.
#
# `tau_pos_s` and `tau_vel_s` are what make this comparable across schedules. Without them
# `rho_pos` is applied once per emitted fix, so the correlation time is
# `-interval_s / ln(rho_pos)` and changing `interval_s` silently changes the error model too.
# With them, `sigma_pos_m` is the steady-state standard deviation in metres and the timescale
# is fixed in seconds, so `interval_s` can be swept on its own.
[gnss_degradation]
seed = 42

[gnss_degradation.scheduler]
kind = "fixed_interval"
# 5 s between fixes: a real 5x reduction on this 1 Hz recording. `interval_s = 1.0`
# passed every fix through and reduced nothing.
interval_s = 60.0
phase_s = 0.0

[gnss_degradation.fault]
kind = "degraded"
rho_pos = 0.99          # ignored while tau_pos_s is set; kept for a run without it
sigma_pos_m = 35.0      # steady-state wander, metres
tau_pos_s = 500.0
rho_vel = 0.95          # likewise
sigma_vel_mps = 1.5     # steady-state wander, m/s
tau_vel_s = 100.0
r_scale = 5.0           # advertised sigmas x5, so R x25