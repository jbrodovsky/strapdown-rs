# RBPF with gravity anomaly measurements, under GNSS denial.
#
# The same aiding as conf/rbpf_grav.toml, but carrying the GNSS profile of
# conf/rbpf_denied.toml instead of conf/rbpf_degraded.toml -- so `geoperf-denied` compares
# this against data/output/rbpf/denied, two runs that differ ONLY in whether the
# geophysical measurement is present. Scoring a fixed-interval geo run against a
# duty-cycled baseline would report the difference between two GNSS profiles as the
# contribution of the aid.
#
# `core/tests/example_configs.rs` asserts this file's [gnss_degradation] and
# [health_limits] match conf/rbpf_denied.toml exactly. Edit them there, not here.
input = "data/input"
output = "data/output/rbpf/denied_grav"
mode = "particle-filter"
# These recipes read Sensor Logger exports from `data/input`, which are ENU
# convention: at rest the device reports +g along its up axis. The library default
# is NED as of #272, so the frame has to be declared -- `strapdown-sim` checks it
# against the data and refuses rather than silently double-counting gravity (#296).
is_enu = true
seed = 42
generate_plot = true
parallel = true

[logging]
level = "info"
file = "log/rbpf_denied_grav.log"

[particle_filter]
num_particles = 1000
position_init_std_m = [10.0, 10.0, 5.0]
velocity_init_std_mps = 1.0
attitude_init_std_rad = 0.1
position_process_noise_std_m = [1.0, 1.0, 1.0]
velocity_process_noise_std_mps = 1e-3
attitude_process_noise_std_rad = 0.01
geo_bias_init_std = 1.0
geo_bias_process_noise_std = 1e-3
zero_vertical_velocity = true
zero_vertical_velocity_std_mps = 0.1

[geophysical]
# Gravity anomaly measurements
gravity_resolution = "one_minute"
gravity_bias = 0.0
gravity_noise_std = 100.0
# gravity_map_file will be auto-detected if not specified

# Magnetic anomaly disabled for this config
# magnetic_resolution = ""
# magnetic_bias = 0.0
# magnetic_noise_std = 150.0

# Measurement frequency (seconds)
geo_frequency_s = 1.0

[health_limits]
# Matched to conf/rbpf_denied.toml, the baseline this run is scored against.
nis_pos_max = 1000.0
speed_mps_max = 5000.0

[gnss_degradation]
seed = 42

# Denial, not degradation. This is the tier that actually resembles jamming: at Jammertest a
# phone roughly ten metres from a jammer lost lock entirely, and in most runs the jamming
# signal was strong enough to cause complete loss of the GNSS signal. A receiver inside the
# jammed area does not report a noisier position -- it reports nothing.
#
# 30 s of fixes in every 150 is a 20% duty cycle: long enough to re-converge between outages,
# so each outage starts from a comparable state, and 120 s of unaided inertial is where a MEMS
# platform's drift becomes the dominant error and an aid has something to correct.
#
# Sweep `off_s` over 60 / 120 / 300 / 600 to trace how the aid's contribution grows with the
# outage. The fault is `none` on purpose: the fixes that do arrive are the receiver's own, so
# the only variable is availability.
[gnss_degradation.scheduler]
kind = "duty_cycle"
on_s = 30.0
off_s = 120.0
start_phase_s = 0.0

[gnss_degradation.fault]
kind = "none"
