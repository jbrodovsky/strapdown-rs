# SYNTHETIC ARM -- the complement of conf/real/ukf_mag.toml.
#
# Same filter, trajectories, inertial data and GNSS degradation as the real arm. What differs
# is `grav_*` and `mag_*` in data/input: `just preprocess` (`analyze preprocess --synthetic`)
# replaces the phone's readings with those of an ADXL355 gravimeter and an RM3100 magnetometer
# -- the maps at the GNSS track plus each part's datasheet error model, installation ideal
# (analysis/src/analysis/synthetic.py). conf/real/ ran the phone's own readings.
#
# UKF with magnetic anomaly measurements.
#
# Runs from this file end to end. `--geo` used to be reachable only from the `cl` subcommand's
# own flags -- a closed-loop config carrying a [geophysical] section was refused outright -- so
# these six files were retired and the justfile carried the equivalent command lines by hand.
# Both paths now resolve to the same settings and the same runner.
input = "data/input"
output = "data/output/ukf/mag"
mode = "closed-loop"
# These recipes read Sensor Logger exports from `data/input`, which are ENU convention: at rest
# the device reports +g along its up axis. The library default is NED as of #272, so the frame
# has to be declared -- `strapdown-sim` checks it against the data and refuses rather than
# silently double-counting gravity (#296).
is_enu = true
seed = 42
parallel = true
generate_plot = true

[logging]
level = "info"
file = "log/ukf_mag.log"

[closed_loop]
filter = "ukf"

[geophysical]
# The sensors `analyze preprocess --synthetic` planted, not a measurement of the phone. The
# noise is per 10 Hz row -- a row averages 0.1 s of samples -- so these values assume `-f 10`.
# analysis/tests/test_synthetic.py checks every number against the model; `just geo-adopt`
# would overwrite them with re-measured ones, so the pipeline does not run it.

# Magnetometer: PNI RM3100 at cycle count 200, $25 a sensor suite.
#   white noise   15 nT per sample at 440/3 Hz on three axes (User Manual, Table 3-1), so a
#                 0.1 s row carries 15 x sqrt(10 / 146.7) = 3.92 nT
#   turn-on bias  8 nT repeatability and 15 nT hysteresis (Table 3-1), in quadrature: 17 nT
#   drift         no offset drift over 100 h (Regoli et al. 2018), but a floor that does not
#                 average down: 2.2 nT at 1 s where white noise gives 1.38, so 1.7 nT, tau 1 h.
#                 Temperature, 0.5 nT/degC (Strabel et al. 2022), 10% and 1 degC: 0.05 nT
# `magnetic_resolution` is a label: the grid is whatever <stem>_magnetic.nc holds (earth_wdmam,
# 3 arc-minutes).
magnetic_resolution = "two_minutes"
magnetic_bias = 0.0                           # nT; the turn-on bias has zero mean
magnetic_noise_std = 3.91675                  # nT per 10 Hz row
magnetic_bias_init_std = 17.0862              # nT; turn-on and drift, in quadrature
magnetic_bias_process_noise_std = 0.0404123   # nT/sqrt(s); sqrt(sum 2 sigma^2 / tau)

# Seconds between geophysical measurements -- a period, not a frequency. As in conf/real/.
geo_frequency_s = 1.0

[health_limits]
# Identical to conf/ukf_degraded.toml. `geoperf-all` scores this run against that one, so a
# difference in the guards would be reported as geophysical performance.
nis_pos_max = 1000.0
speed_mps_max = 5000.0


# The fringe-of-jamming profile, anchored to measurement rather than to a round number.
#
# Smartphone GNSS is 3-5 m under good multipath and over 10 m in harsh multipath, with
# semi-urban CEP95 around 10-12 m. Under jamming the tracked satellite count falls and GDOP
# rises, so the true error and the advertised accuracy inflate together. 35 m of steady-state
# wander is about 14x this dataset's 2.58 m median advertised accuracy -- a receiver still
# producing fixes, but bad ones.
#
# `tau_pos_s` and `tau_vel_s` are what make this comparable across schedules. Without them
# `rho_pos` is applied once per emitted fix, so the correlation time is
# `-interval_s / ln(rho_pos)` and changing `interval_s` silently changes the error model too.
# With them, `sigma_pos_m` is the steady-state standard deviation in metres and the timescale
# is fixed in seconds, so `interval_s` can be swept on its own.
[gnss_degradation]
seed = 42

[gnss_degradation.scheduler]
kind = "fixed_interval"
# One fix every 60 s from a ~1 Hz receiver. (`interval_s = 1.0` passed every fix through
# and reduced nothing.)
interval_s = 60.0
phase_s = 0.0

[gnss_degradation.fault]
kind = "degraded"
rho_pos = 0.99          # ignored while tau_pos_s is set; kept for a run without it
sigma_pos_m = 35.0      # steady-state wander, metres
tau_pos_s = 500.0
rho_vel = 0.95          # likewise
sigma_vel_mps = 1.5     # steady-state wander, m/s
tau_vel_s = 100.0
r_scale = 5.0           # advertised sigmas x5, so R x25
