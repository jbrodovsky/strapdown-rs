input = "data/input"
output = "data/output/ukf/degraded"
mode = "closed-loop"
seed = 42
parallel = true
generate_plot = true

[logging]
level = "info"
file = "log/ukf_degraded.log"

[filter]
type = "ukf"
ukf_alpha = 0.1
ukf_beta = 2.0
ukf_kappa = 0.0

[gnss_degradation]
seed = 42

[gnss_degradation.scheduler]
kind = "fixed_interval"
interval_s = 60.0
phase_s = 0.0

[gnss_degradation.fault]
kind = "degraded"
rho_pos = 0.98
sigma_pos_m = 5.0
rho_vel = 0.90
sigma_vel_mps = 2.0
r_scale = 5.0