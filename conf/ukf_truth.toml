input = "data/input"
output = "data/output/ukf/truth"
mode = "closed-loop"
seed = 42
parallel = true
generate_plot = true

[logging]
level = "info"
file = "log/ukf_truth.log"

[filter]
type = "ukf"
ukf_alpha = 0.1
ukf_beta = 2.0
ukf_kappa = 0.0

[gnss_degradation]
seed = 42

[gnss_degradation.scheduler]
kind = "pass_through"

[gnss_degradation.fault]
kind = "none"
