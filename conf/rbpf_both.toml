# RBPF with both gravity and magnetic anomaly measurements
input = "data/input"
output = "data/output/rbpf/both"
mode = "particle-filter"
# These recipes read Sensor Logger exports from `data/input`, which are ENU
# convention: at rest the device reports +g along its up axis. The library default
# is NED as of #272, so the frame has to be declared -- `strapdown-sim` checks it
# against the data and refuses rather than silently double-counting gravity (#296).
is_enu = true
seed = 42
generate_plot = true
parallel = true


[logging]
level = "info"
file = "log/rbpf_both.log"

[particle_filter]
num_particles = 1000
position_init_std_m = [10.0, 10.0, 5.0]
velocity_init_std_mps = 1.0
attitude_init_std_rad = 0.1
position_process_noise_std_m = [1.0, 1.0, 1.0]
velocity_process_noise_std_mps = 1e-3
attitude_process_noise_std_rad = 0.01
geo_bias_init_std = 1.0
geo_bias_process_noise_std = 1e-3
zero_vertical_velocity = true
zero_vertical_velocity_std_mps = 0.1

[geophysical]
# Gravity anomaly measurements
gravity_resolution = "one_minute"
gravity_bias = 0.0
gravity_noise_std = 100.0

# Magnetic anomaly measurements
magnetic_resolution = "two_minutes"
magnetic_bias = 0.0
magnetic_noise_std = 150.0

# Measurement frequency (seconds)
geo_frequency_s = 1.0

[health_limits]
# Must match conf/rbpf_degraded.toml: `geoperf-rbpf` scores this run against that one, so a
# difference in the guards would show up as geophysical performance.
nis_pos_max = 1000.0
speed_mps_max = 5000.0

[gnss_degradation]
seed = 42

# This whole section must stay identical to conf/rbpf_degraded.toml. `geoperf-rbpf` measures
# this run against the degraded one, so any difference in the GNSS profile is reported as the
# contribution of the geophysical measurement when it is nothing of the kind.
[gnss_degradation.scheduler]
kind = "fixed_interval"
interval_s = 5.0
phase_s = 0.0

[gnss_degradation.fault]
kind = "degraded"
rho_pos = 0.99
sigma_pos_m = 3.0     # ~21 m steady-state wander
rho_vel = 0.95
sigma_vel_mps = 0.3   # ~1 m/s steady-state wander
r_scale = 5.0         # advertised sigmas x5, so R x25
