[package]
name = "strapdown-core"
version = "1.0.0"
description = "A toolbox for building and analyzing strapdown inertial navigation systems as well as simulating various scenarios of GNSS signal degradation."
readme = "README.md"
keywords = ["strapdown", "inertial", "navigation", "IMU", "INS"]
categories = ["aerospace", "science", "simulation"]
documentation = "https://docs.rs/strapdown-core/"

# The integration tests do not ship, and this is the whole of #397.
#
# Two problems, one cause. `core/tests/test_data.csv` is **3.1 MB** of Sensor Logger records
# that exist to gate this repository's own accuracy baseline; nothing in the published library
# reads it, and every consumer would pay for it on every fetch, forever. And
# `tests/perf_baseline.rs` resolves the fragment it validates as
# `CARGO_MANIFEST_DIR/../book/src/development/baseline-tables.md` -- a sibling of this package
# directory, so outside the package root and impossible for `cargo package` to include. A
# consumer who downloaded the crate and ran `cargo test` got a failure pointing at a file they
# cannot have and at a bless workflow that regenerates a book they did not get.
#
# `cargo publish`'s verification step runs `cargo build`, not `cargo test`, so neither problem
# is visible to CI -- only to someone who has already downloaded the crate. That is the worst
# place to find it, and a published 1.0.0 can only be yanked, not unpublished.
#
# Excluding the directory solves both: the fixture stops shipping and the test that cannot run
# in a package no longer ships either. The accuracy gate is a repository-level guard, not a
# consumer-facing test, and `cargo test --workspace` in a git checkout is unaffected.
exclude = ["tests/"]

authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
# `all-features = true` is safe again, and this block is deliberately back to it.
#
# It is what the manifest said when strapdown-core 0.5.0 failed to document at all
# (docs.rs build 3094875): `--all-features` turns on `netcdf`, and `netcdf-sys`'s build
# script panicked with "A system version of libnetcdf could not be found" because the
# docs.rs sandbox has neither libnetcdf nor libhdf5. The stopgap was to document only the
# two pure-Rust features, which hid every hdf5/netCDF I/O helper on `TestDataRecord` and
# `NavigationResult` from the rendered docs.
#
# The dependencies below now carry `features = ["static"]`, so both C libraries are built
# from source and no system library is consulted on any machine, docs.rs included (#335).
# There is nothing left for `--all-features` to get wrong.
all-features = true
rustdoc-args = [ "--html-in-header", "katex-header.html" ]

[lib]
name = "strapdown"
path = "src/lib.rs"

[features]
# Minimal by default: no HDF5, netCDF or MCAP system libraries required.
# `cargo build -p strapdown-core` needs nothing beyond a Rust toolchain.
default = []
clap = ["dep:clap"]
# Binary data formats. Each pulls in a C library built from source (libhdf5, libnetcdf --
# see the dependency declarations below) or a sizeable dependency tree, so they are opt-in:
# the default build needs nothing but a Rust toolchain, these need cmake and a C compiler.
hdf5 = ["dep:hdf5"]
netcdf = ["dep:netcdf"]
mcap = ["dep:mcap", "dep:memmap2", "dep:rmp-serde"]
# Everything, for convenience and for `cargo test --all-features`.
full = ["clap", "hdf5", "netcdf", "mcap"]

[dependencies]
angle = "0.5.0"
nav-types = "0.5.2"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.7"
memmap2 = { version = "0.9", optional = true }
rmp-serde = { version = "1.3", optional = true }
# `static` builds libhdf5 from source (via `hdf5-metno-src`) rather than linking a system
# copy; see `[package.metadata.docs.rs]` above and #335. `zlib` is not needed by anything
# this crate writes -- the datasets are flat and uncompressed -- but `netcdf-sys`'s own
# `static` feature forces `hdf5-sys/zlib` on. Without it here, `--features hdf5` and
# `--all-features` would configure two different libhdf5 builds and rebuild the C library
# every time you switched between them.
hdf5 = { package = "hdf5-metno", version = "0.12", features = ["static", "zlib"], optional = true }
mcap = { version = "0.23", optional = true }

nalgebra.workspace = true
chrono.workspace = true
serde.workspace = true
rand.workspace = true
rand_distr.workspace = true
csv.workspace = true
log.workspace = true
anyhow.workspace = true
thiserror.workspace = true
netcdf = { workspace = true, features = ["static"], optional = true }
# Deliberately NOT feature-gated, though #263 asked for a `wmm` feature.
#
# `MagnetometerYawMeasurement::get_declination` (`measurements.rs`) is the only consumer
# that needs a real WMM lookup, and `messages::build_event_stream` emits a
# `MagnetometerYawMeasurement` for every record with finite magnetometer channels, with
# `apply_declination: true`. Gating it would make the *numerical output of the filter*
# depend on a cargo feature -- declination silently zero with the feature off -- which
# breaks feature additivity in the one channel this crate can least afford it, and would
# move the 22 `build_event_stream` call sites in `core/tests/integration_tests.rs` against
# a dataset that does carry mag columns.
#
# Measured cost, clean `cargo build -p strapdown-core --no-default-features --timings`:
# the wmm subtree is ~20% of build CPU, almost all of it `uom` (7.75 s) rather than
# `world_magnetic_model` itself (0.16 s). `uom` finishes last, so removing the subtree
# would take roughly 1.2 s off an 11.1 s wall clock. Real, but not worth a silent
# behaviour fork.
world_magnetic_model.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
assert_approx_eq.workspace = true
tempfile.workspace = true

[lints]
workspace = true
