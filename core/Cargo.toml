[package]
name = "strapdown-core"
version = "1.0.0"
description = "A toolbox for building and analyzing strapdown inertial navigation systems as well as simulating various scenarios of GNSS signal degradation."
readme = "README.md"
keywords = ["strapdown", "inertial", "navigation", "IMU", "INS"]
categories = ["aerospace", "science", "simulation"]
documentation = "https://docs.rs/strapdown-core/"

authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--html-in-header", "katex-header.html" ]

[lib]
name = "strapdown"
path = "src/lib.rs"

[features]
default = []
clap = ["dep:clap"]

[dependencies]
angle = "0.5.0"
nav-types = "0.5.2"
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.7"
memmap2 = "0.9"
rmp-serde = "1.3"
hdf5 = { package = "hdf5-metno", version = "0.12" }
mcap = "0.23"

nalgebra.workspace = true
chrono.workspace = true
serde.workspace = true
rand.workspace = true
rand_distr.workspace = true
csv.workspace = true
log.workspace = true
anyhow.workspace = true
netcdf.workspace = true
world_magnetic_model.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
assert_approx_eq.workspace = true
tempfile.workspace = true
