name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # `+stable` is deliberate. `rust-toolchain.toml` pins the workspace to 1.91 for lint
      # reproducibility, and that pin would otherwise apply here too -- building a
      # third-party tool against an older toolchain than it supports is the classic way to
      # break a docs deploy for a reason that has nothing to do with the docs.
      - name: Install mdBook
        run: |
          cargo +stable install mdbook --version 0.4.40
          mdbook --version

      - name: Build the book
        run: |
          cd book
          mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
