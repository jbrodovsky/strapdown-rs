name: Test, Lint, and Build Rust Project

on:
  push:
    branches: [ "main" ]
  # Pull requests are filtered on their *base*, and a stacked pull request's base is its
  # parent in the stack rather than `main`. With `main` alone here, every pull request in a
  # stack except the one at the bottom got **no CI at all** -- not a failure, no check runs,
  # a green tick from nothing having run. The v1.0 spine is nine deep, so that is nine
  # changes shipping unverified into the one that does get checked.
  #
  # `v1/**` is the spine's own convention (`docs/V1_QUEUE.md`), `claude/**` covers the
  # agent-authored branches that recent pull requests have used.
  pull_request:
    branches: [ "main", "v1/**", "claude/**" ]

env:
  CARGO_TERM_COLOR: always

# Every job below sets `timeout-minutes`. GitHub's default is 360, and this crate's
# characteristic failures -- a filter that diverges, a closed loop that stops making progress --
# are hangs rather than crashes, so without it a stalled job burns six hours per matrix leg
# before anyone hears about it. The values are sized from what each job does with headroom, not
# fitted to a recent run; a job that legitimately outgrows its limit should have the limit
# raised deliberately. `ExecutionLimits` guards the library's own loops; this guards the job
# around them. #379.
jobs:
  # strapdown-core with default features needs no C toolchain at all -- not even cmake.
  # Keeping this job dependency-free is what makes the matrix below cheap and what most
  # crates.io consumers will actually build. The vendored C libraries are covered by
  # `vendored` and `full` instead.
  minimal:
    name: strapdown-core (no default features)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Pinned to the declared MSRV rather than `stable`, deliberately.
      #
      # `[workspace.lints]` enforces clippy's pedantic and nursery groups with `-D warnings`.
      # Those groups gain lints every Rust release, so against a floating `stable` the gate is
      # not reproducible: unrelated PRs go red six weeks after they were written, and
      # a local `cargo clippy` cannot predict the result. That is not a hypothetical -- it
      # broke this very PR, on lints that did not exist locally. `rust-toolchain.toml` pins
      # the same version locally, so the two agree by construction.
      #
      # Keep this in sync with `rust-version` in Cargo.toml, `channel` in
      # rust-toolchain.toml, and `msrv` in clippy.toml.
      # Trade-off: CI no longer catches breakage introduced by newer toolchains. A scheduled
      # job on `stable`, non-blocking, is the usual way to recover that signal.
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p strapdown-core --no-default-features --locked

      - name: Lint
        run: cargo clippy -p strapdown-core --all-targets --no-default-features --locked -- -D warnings

      # `PERF_EMIT_MEASURED` makes the accuracy suite write this platform's raw numbers
      # alongside gating on them. That is what turns #386 from an argument into a measurement:
      # the suite already ran on all three legs, but nothing ever collected what each one saw,
      # so the cross-platform spread could only be discovered by a leg going red.
      - name: Test
        run: cargo test -p strapdown-core --no-default-features --locked
        env:
          PERF_EMIT_MEASURED: measured-${{ matrix.os }}.json

      # `always()`: a leg that failed the accuracy gate is the one whose numbers are most worth
      # having. Without this the artifact appears only when nothing was wrong with it.
      - name: Upload measured accuracy metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-${{ matrix.os }}
          path: measured-${{ matrix.os }}.json
          if-no-files-found: warn

  # What the three legs above actually measured, side by side.
  #
  # #386: `perf_baseline.json` records one value per metric and `rust.yml` gates it on three
  # platforms, so two of them are asserting "this is what Linux measured". The spread was
  # invisible until a leg went red -- `real_rbpf_slice__rbpf`'s `horizontal_cep95_m` read
  # 34.02 m on Linux against 24.33 m on Windows, a 28.5% difference on a commit that was
  # behaving identically.
  #
  # Advisory on purpose. Its job is to *report* the spread so a tolerance can be set from data
  # rather than from a guess; making it blocking before anyone has seen its output would gate
  # on a number nobody has measured, which is the mistake it exists to correct.
  platform-spread:
    name: Cross-platform accuracy spread (advisory)
    runs-on: ubuntu-latest
    needs: minimal
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: measured-*
          merge-multiple: true

      - name: Report the spread
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(measured-*.json)
          if [ ${#files[@]} -lt 2 ]; then
            echo "Only ${#files[@]} platform file(s); nothing to compare."
            exit 0
          fi
          echo "Comparing: ${files[*]}"
          jq -s '
            [ .[] | .platform as $p | .scenarios | to_entries[]
              | .key as $s | .value | to_entries[]
              | select(.value != null)
              | {scenario: $s, metric: .key, platform: $p, value: .value} ]
            | group_by(.scenario + "/" + .metric)
            | map(select(length > 1))
            | map({
                key: (.[0].scenario + " / " + .[0].metric),
                lo: (map(.value) | min),
                hi: (map(.value) | max),
                values: (map({(.platform): .value}) | add)
              })
            | map(. + {spread_pct: (if (.lo | fabs) > 0 then ((.hi - .lo) / (.lo | fabs) * 100) else 0 end)})
            | sort_by(-.spread_pct)
            | .[:25][]
            | "\(.spread_pct | . * 100 | round / 100)%  \(.key)  \(.values)"
          ' -r measured-*.json || {
            echo "comparison failed; the raw files are attached as artifacts"
            exit 0
          }

  # Full workspace, all features. Builds libhdf5, libnetcdf, zlib and freetype from source
  # (see the `static` features in core/ and geonav/), so it needs cmake and a C/C++ compiler
  # -- both preinstalled on the runner -- and no apt packages at all. Linux only: `vendored`
  # below covers the other two platforms for the part that is platform-sensitive.
  full:
    name: Workspace (all features)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pinned to the MSRV -- see the note in the `minimal` job above.
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # #263's literal acceptance criterion. It belongs here rather than in `minimal`,
      # because `strapdown-geonav` depends on netcdf unconditionally, so a workspace build
      # compiles libnetcdf from source whatever the feature flags say -- the `minimal` job
      # deliberately needs no C toolchain and builds `strapdown-core` alone.
      - name: Build (workspace, no default features)
        run: cargo build --workspace --no-default-features --locked

      - name: Test
        run: cargo test --workspace --all-features --locked

  # The vendored C build is the one thing `minimal` cannot see: it builds strapdown-core
  # alone, with no default features, so it never links netCDF. `full` builds it but only on
  # Linux. This job is the macOS/Windows canary for `netcdf-src` and `hdf5-metno-src` --
  # cmake-driven source builds are where platform differences actually show up, and a break
  # here should be caught by CI rather than by someone running `cargo install`.
  vendored:
    name: Vendored netCDF/HDF5 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - name: Build strapdown-geonav
        run: cargo build -p strapdown-geonav --locked

  # Semver gate for the published API. Advisory, and inert until v1.0.0 is tagged.
  #
  # The obvious wiring -- `cargo semver-checks` with its default registry baseline -- would be
  # a green tick that checks nothing. It compares against the last version on crates.io, which
  # is 0.5.0 against a declared 1.0.0; under a major bump every breaking change is permitted,
  # so the tool would pass whatever the diff did. Worse than absent, because it reads as
  # covered.
  #
  # So the baseline is the newest release tag instead, and the job skips itself when there is
  # none. Today there is none and this does nothing; the moment v1.0.0 is tagged it starts
  # comparing each pull request's public API against the released one, which is the question
  # worth asking after a 1.0 and is meaningless before it.
  #
  # What it does and does not catch, measured by running it on this branch against `main`
  # (`--baseline-rev main`, 151 s, "5 major and 0 minor checks failed"). It found every
  # struct-level break and named them exactly: the three removed or renamed types, the two
  # renamed public fields, and the twelve structs marked `#[non_exhaustive]`.
  #
  # It found **none of the function-signature changes** in the same diff --
  # `ErrorStateKalmanFilter::new` moving from `&[f64]` to `&[f64; 6]`, and the four compute-layer
  # returns moving from `anyhow::Result` to `Result<_, StrapdownError>`. Those are real breaks
  # that a caller feels at compile time. So a green run here means "no struct-level break was
  # detected", not "no breaking change": it is a floor, not a proof, and a signature change
  # still needs a human to notice it.
  #
  # `continue-on-error` while the repo builds a track record: the tool reports findings this
  # project has never triaged, and a new gate that blocks on its first unknown output gets
  # switched off rather than read. Flip it once a release cycle has gone by with the output
  # understood -- that is a deliberate decision, not an oversight.
  #
  # The tool is pinned rather than taken from the action, which resolves the latest release at
  # run time: `pedantic`-style churn in what a linter reports is exactly the reproducibility
  # problem the toolchain pin above exists to avoid.
  #
  # 0.49.0 specifically, and not the newest. cargo-semver-checks 0.50.0 requires rustc 1.93
  # while this project pins 1.91, so installing the latest fails outright:
  #
  #     error: cannot install package `cargo-semver-checks 0.50.0`, it requires rustc 1.93 or
  #     newer, while the currently active rustc version is 1.91.1
  #     `cargo-semver-checks 0.49.0` supports rustc 1.91
  #
  # Raise this pin together with the MSRV, not before it.
  semver:
    name: Semver (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - name: Find the newest release tag
        id: baseline
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No v* tag yet, so there is no released API to compare against." >> "$GITHUB_STEP_SUMMARY"
            echo "found=" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing the public API against \`$tag\`." >> "$GITHUB_STEP_SUMMARY"
            echo "found=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-semver-checks
        if: steps.baseline.outputs.found != ''
        run: cargo install cargo-semver-checks --version 0.49.0 --locked

      - name: Check strapdown-core
        if: steps.baseline.outputs.found != ''
        continue-on-error: true
        run: cargo semver-checks --package strapdown-core --baseline-rev "${{ steps.baseline.outputs.found }}"
