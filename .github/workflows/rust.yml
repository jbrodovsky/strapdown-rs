name: Test, Lint, and Build Rust Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # strapdown-core with default features needs no system libraries at all.
  # Keeping this job dependency-free is what makes the matrix below cheap and
  # what most crates.io consumers will actually build.
  minimal:
    name: strapdown-core (no default features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Pinned to the declared MSRV rather than `stable`, deliberately.
      #
      # `[workspace.lints]` enforces clippy's pedantic and nursery groups with `-D warnings`.
      # Those groups gain lints every Rust release, so against a floating `stable` the gate is
      # not reproducible: unrelated PRs go red six weeks after they were written, and
      # `pixi run lint` (which uses the pinned 1.91) cannot predict the result. That is not a
      # hypothetical -- it broke this very PR, on lints that did not exist locally.
      #
      # Keep this in sync with `rust-version` in Cargo.toml and the `rust` pin in pixi.toml.
      # Trade-off: CI no longer catches breakage introduced by newer toolchains. A scheduled
      # job on `stable`, non-blocking, is the usual way to recover that signal.
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p strapdown-core --no-default-features --locked

      - name: Lint
        run: cargo clippy -p strapdown-core --all-targets --no-default-features --locked -- -D warnings

      - name: Test
        run: cargo test -p strapdown-core --no-default-features --locked

  # Full workspace, all features. Needs libhdf5/libnetcdf and the plotters
  # font stack, so it runs on Linux only.
  full:
    name: Workspace (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the MSRV -- see the note in the `minimal` job above.
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config \
            libhdf5-dev \
            libnetcdf-dev \
            zlib1g-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

