name: Test, Lint, and Build Rust Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # strapdown-core with default features needs no system libraries at all.
  # Keeping this job dependency-free is what makes the matrix below cheap and
  # what most crates.io consumers will actually build.
  minimal:
    name: strapdown-core (no default features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build -p strapdown-core --no-default-features --locked

      - name: Lint
        run: cargo clippy -p strapdown-core --all-targets --no-default-features --locked -- -D warnings

      - name: Test
        run: cargo test -p strapdown-core --no-default-features --locked

  # Full workspace, all features. Needs libhdf5/libnetcdf and the plotters
  # font stack, so it runs on Linux only.
  full:
    name: Workspace (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config \
            libhdf5-dev \
            libnetcdf-dev \
            zlib1g-dev \
            libfreetype6-dev \
            libfontconfig1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked
