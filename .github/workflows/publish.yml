name: Publish Crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `cargo publish --dry-run` without uploading"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Pinned, not `stable`. `cargo publish`'s verification step builds the packaged crate
      # directly rather than as a dependency, so `--cap-lints allow` does not apply and the
      # `deny`-level pedantic/nursery lints are live here -- exactly the drift that
      # rust.yml pins against. Keep in sync with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy, rustfmt

      # The C dependencies are built from source (#335), so the cache is what keeps a
      # release from paying a full libhdf5 + libnetcdf build every time.
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      # Order matters: strapdown-sim and strapdown-geonav both depend on
      # strapdown-core, so it has to exist on crates.io first. `cargo publish`
      # blocks until each crate is available in the index before returning, so
      # the next step can resolve it.
      - name: Publish strapdown-core
        run: cargo publish -p strapdown-core --locked ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish strapdown-geonav
        run: cargo publish -p strapdown-geonav --locked ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish strapdown-sim
        run: cargo publish -p strapdown-sim --locked ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
