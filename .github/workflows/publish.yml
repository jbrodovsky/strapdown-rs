name: Publish Crates

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run `cargo publish --dry-run` without uploading"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libhdf5-dev libnetcdf-dev \
            libfreetype6-dev libfontconfig1-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  publish:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libhdf5-dev libnetcdf-dev \
            libfreetype6-dev libfontconfig1-dev

      # Order matters: strapdown-sim and strapdown-geonav both depend on
      # strapdown-core, so it has to exist on crates.io first. `cargo publish`
      # blocks until each crate is available in the index before returning, so
      # the next step can resolve it.
      - name: Publish strapdown-core
        run: cargo publish -p strapdown-core --locked ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish strapdown-geonav
        run: cargo publish -p strapdown-geonav --locked ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish strapdown-sim
        run: cargo publish -p strapdown-sim --locked ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
