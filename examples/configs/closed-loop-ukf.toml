input = "input.csv"
output = "output.csv"
mode = "closed-loop"
seed = 42
parallel = false

[logging]
level = "info"

[closed_loop]
filter = "ukf"

[aiding]
seed = 42

[aiding.scheduler]
kind = "pass_through"

[aiding.fault]
kind = "none"

# The `[gnss_degradation.magnetometer]` table that used to sit here was removed at the v1.0
# freeze: `reference_field_ned`, `hard_iron_offset`, `soft_iron_matrix` and `noise_std` match
# no field on `AidingConfig` and never did, in any version, so serde discarded the whole table
# silently. The magnetometer channel is scheduled by `magnetometer_scheduler` (1 Hz by
# default); there is no switch that turns it off, so `enabled = false` was never honoured.
