# Example configuration with parallel execution and custom logging
# This demonstrates the new parallel processing and logging configuration options

# Input can be a single CSV file or a directory of CSV files
input = "data/input"

# Output directory where results will be saved
output = "data/output"

# Simulation mode: "dead-reckoning", "open-loop", "closed-loop", or "particle-filter"
mode = "closed-loop"

# Random seed for reproducibility
seed = 42

# Enable parallel processing when multiple files are detected
# When true, files will be processed concurrently using all available CPU cores
parallel = true

# Logging configuration
[logging]
# Log level: "off", "error", "warn", "info", "debug", or "trace"
level = "info"
# Optional log file path (omit to log to stderr)
file = "simulation.log"

# Closed-loop filter configuration (only used in closed-loop mode)
[closed_loop]
filter = "ukf"  # "ukf" or "ekf"

# GNSS degradation configuration
[aiding]
seed = 42

[aiding.scheduler]
kind = "pass_through"

[aiding.fault]
kind = "none"

# The `[gnss_degradation.magnetometer]` table that used to sit here was removed at the v1.0
# freeze: `reference_field_ned`, `hard_iron_offset`, `soft_iron_matrix` and `noise_std` match
# no field on `AidingConfig` and never did, in any version, so serde discarded the whole table
# silently. The magnetometer channel is scheduled by `magnetometer_scheduler` (1 Hz by
# default); there is no switch that turns it off, so `enabled = false` was never honoured.
