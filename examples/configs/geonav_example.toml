# Example configuration with geophysical measurements.
#
# Every spelling here is the one the parser accepts, which is not always the one the
# CLI uses: `mode` and `filter` are kebab-case, resolutions are snake_case, and the
# scheduler/fault tag key is `kind`, not `type`. Run `cargo test -p strapdown-core
# --test example_configs` after editing -- it parses this file and fails if a variant
# name is wrong, because a misspelling otherwise falls back to a default silently.

input = "data/input/sample.csv"
output = "data/output/geonav_result.csv"
mode = "closed-loop"
seed = 42
parallel = false
generate_plot = false

[logging]
level = "info"

[closed_loop]
filter = "ukf"

[geophysical]
# Gravity anomaly measurements
gravity_resolution = "one_minute"
gravity_bias = 0.0
gravity_noise_std = 100.0
# gravity_map_file will be auto-detected if not specified

# Magnetic anomaly measurements
magnetic_resolution = "one_minute"
magnetic_bias = 0.0
magnetic_noise_std = 150.0
# magnetic_map_file will be auto-detected if not specified

# Measurement interval in seconds -- a period, not a frequency.
geo_interval_s = 1.0

[aiding]
seed = 42

[aiding.scheduler]
kind = "pass_through"

[aiding.fault]
kind = "none"
