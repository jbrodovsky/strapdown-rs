# Promoted to a full simulation config at the v1.0 freeze. `--config` parses a
# `SimulationConfig`, so a bare aiding document could not be passed to it -- it failed
# with `missing field `mode``. The scenario itself is unchanged, just nested under
# `aiding:`. `input`/`output` are omitted, so they default to input.csv and output.csv in
# the working directory. `--config` supplies the whole run and the subcommand's `-i`/`-o`
# are ignored alongside it, so point this at your own data by adding `input:`/`output:`
# here rather than on the command line.
mode: closed-loop
aiding:
  scheduler:
    kind: pass_through
  fault:
    kind: slow_bias
    drift_n_mps: 0.02
    drift_e_mps: 0.0
    q_bias: 5e-6
    rotate_omega_rps: 1e-3
  seed: 42
