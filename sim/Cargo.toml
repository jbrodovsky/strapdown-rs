[package]
name = "strapdown-sim"
version = "1.0.0"
description = "Command-line simulator for strapdown inertial navigation: dead reckoning, GNSS-aided filtering (EKF/UKF/ESKF/particle), and GNSS degradation scenarios."
readme = "README.md"
keywords = ["strapdown", "inertial", "navigation", "simulation", "GNSS"]
categories = ["command-line-utilities", "aerospace", "simulation"]

authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["plotting"]
plotting = ["dep:plotters"]
geonav = ["dep:strapdown-geonav"]

[dependencies]
strapdown-core = { path = "../core", features = ["clap"], version = "1.0.0" }
strapdown-geonav = { path = "../geonav", optional = true, version = "0.1.0" }
env_logger = "0.11"
rayon = "1.10"
plotters = { version = "0.3.7", optional = true }

clap.workspace = true
log.workspace = true
chrono.workspace = true
nalgebra.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "strapdown-sim"
path = "src/main.rs"
