[package]
name = "strapdown-sim"
version = "1.0.0"
description = "Command-line simulator for strapdown inertial navigation: dead reckoning, GNSS-aided filtering (EKF/UKF/ESKF/particle), and GNSS degradation scenarios."
readme = "README.md"
keywords = ["strapdown", "inertial", "navigation", "simulation", "GNSS"]
categories = ["command-line-utilities", "aerospace", "simulation"]
documentation = "https://docs.rs/strapdown-sim/"

authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
# Still documented without default features, but no longer because it *cannot* be otherwise.
# `plotting` and `geonav` both used to need system libraries the docs.rs sandbox lacks; since
# #335 they build their C dependencies from source and would document fine. Neither gates a
# public item that is interesting to a reader of this crate's docs, though, so skipping them
# keeps the docs build small for no loss (#263).
no-default-features = true

[features]
default = ["plotting"]
plotting = ["dep:plotters"]
geonav = ["dep:strapdown-geonav"]

[dependencies]
strapdown-core = { path = "../core", features = ["clap"], version = "1.0.0" }
strapdown-geonav = { path = "../geonav", optional = true, version = "0.1.0" }
env_logger = "0.11"
rayon = "1.10"
# `fontconfig-dlopen` is what lets this build with no system libraries at all. plotters draws
# text through `font-kit`, which otherwise links libfontconfig at build time and needs
# `libfontconfig-dev` present; the feature switches it to a runtime `dlopen` instead. The
# other half of the stack, `freetype-sys`, already compiles its bundled C sources when
# pkg-config finds nothing. Note the trade: libfontconfig is now a *runtime* requirement of
# the `plotting` feature rather than a build-time one, so a machine without it builds fine
# and fails when it first tries to render text.
plotters = { version = "0.3.7", features = ["fontconfig-dlopen"], optional = true }

clap.workspace = true
log.workspace = true
chrono.workspace = true
nalgebra.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "strapdown-sim"
path = "src/main.rs"

[lints]
workspace = true
