[workspace]
authors = ["James Brodovsky <james.brodovsky@gmail.com>"]
channels = ["conda-forge"]
name = "strapdown-rs"
platforms = ["linux-64", "osx-64", "win-64"]
version = "0.0.1"
description = "A simple strapdown INS implementation in Rust with accompanying simulation and geo-location capabilities."
license = "MIT"

[activation.env]
RUST_BACKTRACE = "1"
HDF5_DIR = "${PIXI_PROJECT_ROOT}/.pixi/envs/default"
RUSTFLAGS="-C link-args=-Wl,-rpath,${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib"
LIBRARY_PATH="${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib"
PATH = "${PIXI_PROJECT_ROOT}/target/release:${PATH}"
RUSTDOCFLAGS="--html-in-header ${PIXI_PROJECT_ROOT}/katex-header.html"
PKG_CONFIG_PATH = "${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib/pkgconfig"

[tasks]
build = "cargo build --workspace --release"
lint = "ruff check --select I --fix && cargo clippy --all-targets --all-features --fix --allow-dirty -- -D warnings"
fmt = "ruff format . && cargo fmt"
code = "code ."
coverage = "cargo tarpaulin --workspace --timeout 600"
sim = """
./target/release/strapdown-sim --config conf/ukf_truth.toml && \
./target/release/strapdown-sim --config conf/ukf_both.toml && \
./target/release/strapdown-sim --config conf/ukf_grav.toml && \
./target/release/strapdown-sim --config conf/ukf_mag.toml && \
./target/release/strapdown-sim --config conf/ekf_truth.toml && \
./target/release/strapdown-sim --config conf/ekf_both.toml && \
./target/release/strapdown-sim --config conf/ekf_grav.toml && \
./target/release/strapdown-sim --config conf/ekf_mag.toml
"""

sim-rbpf = """
./target/release/strapdown-sim --config conf/rbpf_truth.toml && \
./target/release/strapdown-sim --config conf/rbpf_degraded.toml && \
./target/release/strapdown-sim --config conf/rbpf_grav.toml && \
./target/release/strapdown-sim --config conf/rbpf_mag.toml && \
./target/release/strapdown-sim --config conf/rbpf_both.toml
"""

postprocess = """
analyze performance --processed data/output/ukf/truth --reference data/input/ --output data/output/ukf/truth/performance && \
analyze performance --processed data/output/ukf/both --reference data/input/ --output data/output/ukf/both/performance && \
analyze performance --processed data/output/ukf/grav --reference data/input/ --output data/output/ukf/grav/performance && \
analyze performance --processed data/output/ukf/mag --reference data/input/ --output data/output/ukf/mag/performance && \
analyze performance --processed data/output/ekf/truth --reference data/input/ --output data/output/ekf/truth/performance && \
analyze performance --processed data/output/ekf/both --reference data/input/ --output data/output/ekf/both/performance && \
analyze performance --processed data/output/ekf/grav --reference data/input/ --output data/output/ekf/grav/performance && \
analyze performance --processed data/output/ekf/mag --reference data/input/ --output data/output/ekf/mag/performance
"""

postprocess-rbpf = """
analyze performance --processed data/output/rbpf/truth --reference data/input/ --output data/output/rbpf/truth/performance && \
analyze performance --processed data/output/rbpf/degraded --reference data/input/ --output data/output/rbpf/degraded/performance && \
analyze performance --processed data/output/rbpf/both --reference data/input/ --output data/output/rbpf/both/performance && \
analyze performance --processed data/output/rbpf/grav --reference data/input/ --output data/output/rbpf/grav/performance && \
analyze performance --processed data/output/rbpf/mag --reference data/input/ --output data/output/rbpf/mag/performance
"""

# Geophysical performance analysis with LaTeX tables and detailed CSV
geoperf-ukf-grav = "analyze geoperformance -p data/output/ukf/grav -d data/output/ukf/degraded -r data/input -o data/output/ukf/grav/analysis -f ukf --geo-type grav"
geoperf-ukf-mag = "analyze geoperformance -p data/output/ukf/mag -d data/output/ukf/degraded -r data/input -o data/output/ukf/mag/analysis -f ukf --geo-type mag"
geoperf-ukf-both = "analyze geoperformance -p data/output/ukf/both -d data/output/ukf/degraded -r data/input -o data/output/ukf/both/analysis -f ukf --geo-type both"

geoperf-ekf-grav = "analyze geoperformance -p data/output/ekf/grav -d data/output/ekf/degraded -r data/input -o data/output/ekf/grav/analysis -f ekf --geo-type grav"
geoperf-ekf-mag = "analyze geoperformance -p data/output/ekf/mag -d data/output/ekf/degraded -r data/input -o data/output/ekf/mag/analysis -f ekf --geo-type mag"
geoperf-ekf-both = "analyze geoperformance -p data/output/ekf/both -d data/output/ekf/degraded -r data/input -o data/output/ekf/both/analysis -f ekf --geo-type both"

# Run all geoperformance analyses
geoperf-all = """
analyze geoperformance -p data/output/ukf/grav -d data/output/ukf/degraded -r data/input -o data/output/ukf/grav/analysis -f ukf --geo-type grav && \
analyze geoperformance -p data/output/ukf/mag -d data/output/ukf/degraded -r data/input -o data/output/ukf/mag/analysis -f ukf --geo-type mag && \
analyze geoperformance -p data/output/ukf/both -d data/output/ukf/degraded -r data/input -o data/output/ukf/both/analysis -f ukf --geo-type both && \
analyze geoperformance -p data/output/ekf/grav -d data/output/ekf/degraded -r data/input -o data/output/ekf/grav/analysis -f ekf --geo-type grav && \
analyze geoperformance -p data/output/ekf/mag -d data/output/ekf/degraded -r data/input -o data/output/ekf/mag/analysis -f ekf --geo-type mag && \
analyze geoperformance -p data/output/ekf/both -d data/output/ekf/degraded -r data/input -o data/output/ekf/both/analysis -f ekf --geo-type both && \
analyze geoperformance -p data/output/rbpf/grav -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/grav/analysis -f rbpf --geo-type grav && \
analyze geoperformance -p data/output/rbpf/mag -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/mag/analysis -f rbpf --geo-type mag && \
analyze geoperformance -p data/output/rbpf/both -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/both/analysis -f rbpf --geo-type both
"""

# Run geoperformance for RBPF results only
geoperf-rbpf-all = """
analyze geoperformance -p data/output/rbpf/grav -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/grav/analysis -f rbpf --geo-type grav && \
analyze geoperformance -p data/output/rbpf/mag -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/mag/analysis -f rbpf --geo-type mag && \
analyze geoperformance -p data/output/rbpf/both -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/both/analysis -f rbpf --geo-type both
"""

# Run geoperformance for RBPF results (if they exist)
geoperf-rbpf-grav = "analyze geoperformance -p data/output/rbpf/grav -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/grav/analysis -f rbpf --geo-type grav"
geoperf-rbpf-mag = "analyze geoperformance -p data/output/rbpf/mag -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/mag/analysis -f rbpf --geo-type mag"
geoperf-rbpf-both = "analyze geoperformance -p data/output/rbpf/both -d data/output/rbpf/degraded -r data/input -o data/output/rbpf/both/analysis -f rbpf --geo-type both"

# Particle filter simulation with post-processing
pf-gravity = """
pf-sim --ins-dir data/output/ukf/degraded --imu-dir data/input --output-dir data/output/pf/gravity_ukf --geo-type gravity --gravity-noise-std 48.93 --num-particles 5000 && \
pf-sim --ins-dir data/output/ekf/degraded --imu-dir data/input --output-dir data/output/pf/gravity_ekf --geo-type gravity --gravity-noise-std 48.93 --num-particles 5000
"""

pf-magnetic = """
pf-sim --ins-dir data/output/ukf/degraded --imu-dir data/input --output-dir data/output/pf/magnetic_ukf --geo-type magnetic --magnetic-noise-std 42303 --num-particles 5000 && \
pf-sim --ins-dir data/output/ekf/degraded --imu-dir data/input --output-dir data/output/pf/magnetic_ekf --geo-type magnetic --magnetic-noise-std 42303 --num-particles 5000
"""

pf-combined = """
pf-sim --ins-dir data/output/ukf/degraded --imu-dir data/input --output-dir data/output/pf/combined_ukf --geo-type combined --gravity-noise-std 48.93 --magnetic-noise-std 42303 --num-particles 5000 && \
pf-sim --ins-dir data/output/ekf/degraded --imu-dir data/input --output-dir data/output/pf/combined_ekf --geo-type combined --gravity-noise-std 48.93 --magnetic-noise-std 42303 --num-particles 5000
"""

# Standalone post-processing for existing PF results
pf-postprocess = """
pf-postprocess -i data/output/pf/gravity && \
pf-postprocess -i data/output/pf/magnetic && \
pf-postprocess -i data/output/pf/combined
"""

[dependencies]
python = ">=3.12,<3.14"
rust = ">=1.91.0,<1.92"
rust-src = ">=1.91.0,<2"
uv = ">=0.9.21,<0.10"
gmt = ">=6.6.0,<7"
pkg-config = ">=0.29.2,<0.30"
freetype = ">=2.14.1,<3"
fontconfig = ">=2.15.0,<3"
expat = ">=2.6.4,<3"
ruff = ">=0.14.11,<0.15"
notebook = ">=7.5.5,<8"

[pypi-dependencies]
analysis = {path = "./analysis", editable = true}
pf = {path = "./pf", editable = true}
