[workspace]
authors = ["James Brodovsky <james.brodovsky@gmail.com>"]
channels = ["conda-forge"]
name = "strapdown-rs"
platforms = ["linux-64", "osx-64", "win-64"]
version = "0.0.1"
description = "A simple strapdown INS implementation in Rust with accompanying simulation and geo-location capabilities."
license = "MIT"

[activation.env]
RUST_BACKTRACE = "1"
HDF5_DIR = "${PIXI_PROJECT_ROOT}/.pixi/envs/default"
RUSTFLAGS="-C link-args=-Wl,-rpath,${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib"
LIBRARY_PATH="${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib"
PATH = "${PIXI_PROJECT_ROOT}/target/release:${PATH}"
RUSTDOCFLAGS="--html-in-header ${PIXI_PROJECT_ROOT}/katex-header.html"
PKG_CONFIG_PATH = "${PIXI_PROJECT_ROOT}/.pixi/envs/default/lib/pkgconfig"

[tasks]
build = "cargo build --workspace --release"
test = "cargo test --workspace --all-features"
doc = "cargo doc --workspace --no-deps"
coverage = "cargo tarpaulin --workspace --timeout 600"
code = "code ."

# `lint` mirrors the CI gate exactly; `lint-fix` applies what it can.
lint = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
lint-fix = "cargo clippy --workspace --all-targets --all-features --fix --allow-dirty -- -D warnings"
fmt = "cargo fmt --all"
fmt-check = "cargo fmt --all -- --check"

[dependencies]
rust = ">=1.91.0,<1.92"
rust-src = ">=1.91.0,<2"
pkg-config = ">=0.29.2,<0.30"

# Required by the `hdf5-metno` and `netcdf` crates in strapdown-core.
# These were previously pulled in transitively by `gmt`; declared explicitly
# now that the Python analysis package is out of the workspace.
hdf5 = ">=2.1.0,<3"
libnetcdf = ">=4.10.0,<5"

# Required by `plotters` (the `plotting` feature of strapdown-sim).
freetype = ">=2.14.1,<3"
fontconfig = ">=2.15.0,<3"
expat = ">=2.6.4,<3"
