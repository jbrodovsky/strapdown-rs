[package]
name = "strapdown-geonav"
description = "Experimental geophysical anomaly navigation (gravity and magnetic map aiding) for strapdown inertial navigation systems."
readme = "README.md"
keywords = ["navigation", "geophysical", "gravity", "magnetic", "anomaly"]
categories = ["aerospace", "science", "simulation"]
documentation = "https://docs.rs/strapdown-geonav/"

# Experimental crate: published alongside the v1.0 release but deliberately
# held at 0.x so its API can change without forcing a major bump on the
# workspace. Do not inherit the workspace version here.
version = "0.1.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

# No `[package.metadata.docs.rs]` block is needed. This crate has no optional features to
# select, and no KaTeX in its doc comments (unlike `strapdown-core`); it renders on docs.rs
# purely because `netcdf` is built from source rather than linked from the system -- see the
# dependency below.

[dependencies]
strapdown-core = { path = "../core", version = "1.0.0" }
nalgebra.workspace = true
chrono.workspace = true
# `static` is set on the dependency rather than exposed as a feature of this crate, and that
# is the whole fix for #335. netCDF is not optional here -- reading NetCDF maps is what the
# crate is for -- so there is no feature set that avoids it, and the docs.rs sandbox has no
# libnetcdf: `strapdown-geonav` 0.1.0 would have failed to document exactly as
# `strapdown-core` 0.5.0 did. A `netcdf-static` *feature* was the obvious answer and was
# rejected, because Cargo cannot exclude a feature from `--all-features` and the CI gate uses
# it. Setting it on the dependency sidesteps that entirely: there is nothing for
# `--all-features` to turn on or off, and `cargo build` needs no system library on any
# machine. The price is cmake and a C compiler at build time.
netcdf = { workspace = true, features = ["static"] }
world_magnetic_model.workspace = true
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
assert_approx_eq.workspace = true

[lib]
name = "geonav"
path = "src/lib.rs"

# Note: The geonav-sim binary has been consolidated into strapdown-sim.
# Use: cargo build --package strapdown-sim --features geonav
# Run: strapdown-sim cl --geo --gravity-resolution ...

[lints]
workspace = true
