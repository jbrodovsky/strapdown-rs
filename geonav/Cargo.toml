[package]
name = "strapdown-geonav"
description = "Experimental geophysical anomaly navigation (gravity and magnetic map aiding) for strapdown inertial navigation systems."
readme = "README.md"
keywords = ["navigation", "geophysical", "gravity", "magnetic", "anomaly"]
documentation = "https://docs.rs/strapdown-geonav/"

# Experimental crate: published alongside the v1.0 release but deliberately
# held at 0.x so its API can change without forcing a major bump on the
# workspace. Do not inherit the workspace version here.
version = "0.1.0"

authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

# NOTE: this crate will not render on docs.rs, and cannot be made to without a trade-off
# that has not been taken. netCDF is a hard dependency here -- reading NetCDF maps is what
# the crate is for -- and the docs.rs sandbox has no libnetcdf, so `netcdf-sys`'s build
# script panics exactly as it did for `strapdown-core` 0.5.0 (see `core/Cargo.toml`). The
# only escape is a `netcdf/static` source build, and a feature offering that would be swept
# up by the `--all-features` in CI and `pixi run lint`. Tracked in #335.

[dependencies]
strapdown-core = { path = "../core", version = "1.0.0" }
nalgebra.workspace = true
chrono.workspace = true
netcdf.workspace = true
world_magnetic_model.workspace = true
anyhow.workspace = true
log.workspace = true

[dev-dependencies]
assert_approx_eq.workspace = true

[lib]
name = "geonav"
path = "src/lib.rs"

# Note: The geonav-sim binary has been consolidated into strapdown-sim.
# Use: cargo build --package strapdown-sim --features geonav
# Run: strapdown-sim cl --geo --gravity-resolution ...

[lints]
workspace = true
